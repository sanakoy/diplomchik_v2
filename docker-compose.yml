version: '3.8'

services:
 postgres_diplomchik_v2:
   image: postgres:15
   container_name: db_diplomchik_v2
   environment:
     POSTGRES_USER: user
     POSTGRES_PASSWORD: 123qwe
     POSTGRES_DB: db_diplomchik_v2
   ports:
     - "127.0.0.1:5435:5432"
   volumes:
     - postgres_data_diplomchik_v2:/var/lib/postgresql/data
   restart: unless-stopped
 postgres_diplomchik_v2_test:
   image: postgres:15
   container_name: db_diplomchik_v2_test
   environment:
     POSTGRES_USER: user
     POSTGRES_PASSWORD: 123qwe
     POSTGRES_DB: db_diplomchik_v2_test
   ports:
     - "127.0.0.1:5436:5432"
   volumes:
     - postgres_data_diplomchik_v2_test:/var/lib/postgresql/data
   restart: unless-stopped

 redis_diplomchik_v2:
   image: redis:7-alpine
   container_name: redis_diplomchik_v2
   ports:
     - "127.0.0.1:6379:6379"
   restart: unless-stopped

volumes:
 postgres_data_diplomchik_v2:
 postgres_data_diplomchik_v2_test:


