# Переменные берутся из .env рядом с этим файлом (см. .env.example).
# Запись ${VAR:?текст} означает: без этой переменной compose не стартует
# и скажет, чего не хватает, вместо тихого запуска с пустым паролем.

# Имя проекта задано явно, иначе compose берёт его из имени папки,
# и тома с контейнерами зависят от того, куда склонировали репозиторий
name: money-tracker

services:
  app:
    build: .
    container_name: money-tracker-app
    # Настройки приложения — из .env, кроме адресов: внутри сети compose
    # контейнеры обращаются друг к другу по имени сервиса, а не по 127.0.0.1
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Браузер ходит в API через nginx из сервиса frontend, и адрес соединения —
      # это адрес nginx. uvicorn возьмёт настоящий адрес клиента из
      # X-Forwarded-For, но только от доверенных адресов. «*» допустимо, пока порт
      # опубликован лишь на 127.0.0.1 (подделать заголовок может только процесс
      # на этой машине). В продакшене здесь адрес или подсеть обратного прокси
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Без обращения к БД: /health отвечает за «процесс жив», а не «зависимости на месте»
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: money-tracker-frontend
    # Всё приложение — на http://localhost:8080: nginx отдаёт фронт
    # и проксирует /api в сервис app
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      # nginx при старте проверяет, что имя app разрешается: ждём бэкенд
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: money-tracker-db
    environment:
      POSTGRES_USER: ${DB_USER:?задайте DB_USER в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:?задайте DB_NAME в .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres_test:
    # Нужна только для pytest, поэтому по умолчанию не поднимается:
    # docker compose --profile test up -d
    profiles: [ "test" ]
    image: postgres:15
    container_name: money-tracker-db-test
    environment:
      # Значения по умолчанию, а не ${VAR:?}: compose разбирает весь файл целиком,
      # и на сервере без TEST_DB_* он бы не запустился даже без этого профиля
      POSTGRES_USER: ${TEST_DB_USER:-user}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test}
      POSTGRES_DB: ${TEST_DB_NAME:-money_tracker_test}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5436}:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: money-tracker-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_data_test:
