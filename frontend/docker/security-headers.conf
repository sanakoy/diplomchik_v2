# Общие заголовки безопасности. Подключаются в каждом location через include:
# add_header внутри location отменяет наследование заголовков из server,
# и без include они молча пропали бы у ответов с Cache-Control

# Браузер не угадывает тип файла по содержимому: .txt не исполнится как скрипт
add_header X-Content-Type-Options "nosniff" always;
# Адрес страницы уходит на чужие сайты только доменом, без пути и параметров
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Страницу нельзя встроить во фрейм на чужом сайте (кликджекинг)
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Скрипты, шрифты и запросы — только со своего адреса. Встроенных скриптов
# в сборке Vite нет, поэтому 'unsafe-inline' для script-src не нужен.
# Для стилей нужен: React пишет style="…" (ширины полос, цвета серий),
# а график Recharts вставляет свой <style>
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS ставится там, где есть HTTPS (на балансировщике или обратном прокси
# с сертификатом): на http://localhost он не имеет смысла
